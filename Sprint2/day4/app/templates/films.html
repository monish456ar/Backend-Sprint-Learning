<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Catalogue & Reviews</title>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: #121316;
            --card-bg: rgba(22, 23, 29, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(168, 85, 247, 0.45);
            --text-primary: #f4f4f6;
            --text-secondary: #9da3af;
            --text-muted: #646b79;
            --accent-primary: #a855f7;
            --accent-secondary: #6366f1;
            --accent-gradient: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #38bdf8 100%);
            --accent-glow: rgba(168, 85, 247, 0.25);
            --star-gold: #fbbf24;
            --star-bg: rgba(251, 191, 36, 0.1);
            --input-bg: rgba(18, 19, 24, 0.85);
            --badge-bg: rgba(255, 255, 255, 0.05);
            --badge-border: rgba(255, 255, 255, 0.1);
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.15), transparent 70%),
                radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.06), transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(168, 85, 247, 0.06), transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            padding: 2.5rem 1.5rem 4rem;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
        }

        /* Header section */
        header {
            margin-bottom: 2.25rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--badge-border);
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #d8b4fe;
            margin-bottom: 1rem;
            backdrop-filter: blur(8px);
            letter-spacing: 0.02em;
        }

        .brand-badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        h1 {
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 0.6rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.98rem;
            max-width: 520px;
            line-height: 1.5;
        }

        /* Search Section */
        .search-container {
            max-width: 680px;
            margin: 0 auto 2.5rem;
        }

        .search-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-radius: var(--radius-lg);
        }

        .search-icon-left {
            position: absolute;
            left: 1.15rem;
            pointer-events: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .search-input {
            width: 100%;
            padding: 1rem 3.25rem 1rem 3.1rem;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            background-color: rgba(24, 25, 32, 0.95);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .search-input:focus ~ .search-icon-left {
            color: var(--accent-primary);
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Spinner Indicator */
        .spinner-wrapper {
            position: absolute;
            right: 1.15rem;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .htmx-request .spinner-wrapper,
        .htmx-request.spinner-wrapper {
            display: flex;
        }

        /* Genre Tags / Quick filters */
        .quick-tags {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.85rem;
            flex-wrap: wrap;
        }

        .quick-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-right: 0.2rem;
        }

        .tag-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--badge-border);
            color: var(--text-secondary);
            font-size: 0.78rem;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag-pill:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Film Grid & Cards */
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.4rem;
        }

        .film-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 1.4rem;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.25s ease, 
                        box-shadow 0.25s ease;
        }

        .film-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
        }

        .film-card:hover {
            transform: translateY(-4px);
            border-color: var(--card-border-hover);
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.6), 0 0 20px -4px var(--accent-glow);
        }

        .film-top {
            margin-bottom: 1rem;
        }

        .film-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .film-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            letter-spacing: -0.015em;
        }

        .film-year {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--badge-border);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .film-people {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-top: 0.75rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .film-people-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .film-people-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .film-people-val {
            color: #d1d5db;
            font-weight: 500;
        }

        .film-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            padding-top: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .film-genre {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #c084fc;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
        }

        .film-rating {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--star-bg);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
        }

        .star-icon {
            color: var(--star-gold);
            font-size: 0.95rem;
            line-height: 1;
        }

        .rating-num {
            color: #fef08a;
        }

        .rating-na {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 500;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 1.5rem;
            color: var(--text-secondary);
            background: rgba(18, 19, 24, 0.6);
            border-radius: var(--radius-xl);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .empty-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 1rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .empty-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .empty-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            h1 { font-size: 1.85rem; }
            body { padding: 1.5rem 1rem 3rem; }
            .film-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand-badge">
                <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
                <span>Live Film Directory</span>
            </div>
            <h1>Cinematic Catalogue</h1>
            <p class="subtitle">Search movies, directors, and critical ratings in real-time with zero full page reloads.</p>
        </header>

        <div class="search-container">
            <div class="search-box-wrapper">
                <span class="search-icon-left">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input 
                    type="text" 
                    id="search-input"
                    name="q" 
                    class="search-input"
                    placeholder="Search by title, director, or genre (e.g. Sci-Fi, Nolan)..." 
                    hx-get="/ui/films/search" 
                    hx-trigger="load, input changed delay:250ms, search" 
                    hx-target="#film-results" 
                    hx-indicator="#search-indicator"
                    autocomplete="off"
                />
                <div id="search-indicator" class="spinner-wrapper">
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="quick-tags">
                <span class="quick-label">Suggestions:</span>
                <span class="tag-pill" onclick="applySearch('Sci-Fi')">Sci-Fi</span>
                <span class="tag-pill" onclick="applySearch('Drama')">Drama</span>
                <span class="tag-pill" onclick="applySearch('Action')">Action</span>
                <span class="tag-pill" onclick="applySearch('Adventure')">Adventure</span>
                <span class="tag-pill" onclick="applySearch('')">Clear filter</span>
            </div>
        </div>

        <div id="film-results">
            <!-- Populated via htmx load trigger -->
        </div>
    </div>

    <script>
        function applySearch(term) {
            const input = document.getElementById('search-input');
            if (input) {
                input.value = term;
                htmx.trigger(input, 'search');
            }
        }
    </script>
</body>
</html>
