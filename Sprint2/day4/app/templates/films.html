<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Catalogue Search</title>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --star-color: #fbbf24;
            --input-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .search-box-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .htmx-indicator {
            display: none;
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: var(--accent);
        }

        .htmx-request.htmx-indicator,
        .htmx-request .htmx-indicator {
            display: inline-block;
        }

        /* Film Grid & Cards */
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .film-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .film-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .film-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .film-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .film-year {
            font-size: 0.85rem;
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-secondary);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .film-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .film-genre {
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .film-rating {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .star-icon {
            color: var(--star-color);
            font-size: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            border: 1px dashed var(--card-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Film Catalogue Search</h1>
            <p class="subtitle">Internal tool for real-time film search powered by htmx</p>
        </header>

        <div class="search-box-wrapper">
            <input 
                type="text" 
                name="q" 
                class="search-input"
                placeholder="Search films by title or genre..." 
                hx-get="/ui/films/search" 
                hx-trigger="input changed delay:300ms, search" 
                hx-target="#film-results" 
                hx-indicator="#search-indicator"
            />
            <span id="search-indicator" class="htmx-indicator">Searching...</span>
        </div>

        <div id="film-results">
            <!-- Initially empty results area -->
        </div>
    </div>
</body>
</html>
